steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'APP_KEY=base64:Hikx6eCzClMZ2IKOfCHRM7ho18SATt5cXze0EeDZQbg='
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/web-app'
      - '.'

  # 2. Push da imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/web-app']

  # 3. Rodar Migrations (Cloud Run Job)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run jobs deploy migration-job \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/web-app \
          --env-vars-file env.yaml \
          --set-cloudsql-instances=$PROJECT_ID:us-central1:db-server \
          --command="php" \
          --args="artisan,migrate,--force" \
          --region=us-central1 && \
        gcloud run jobs execute migration-job --region=us-central1 --wait

  # 4. Deploy final no Cloud Run (Serviço)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'web-app'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/web-app'
      - '--concurrency=1'
      - '--cpu=2'
      - '--memory=1024Mi'
      - '--env-vars-file=env.yaml'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:db-server'
      - '--region=us-central1'
      - '--platform=managed'
      - '--timeout=700' # da mais tempo pro octane subir
      - '--port=8080'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/web-app'

options:
  logging: CLOUD_LOGGING_ONLY